# ──────────────────────────────────────────────────────────────────────
# 🎨 Thème (Tokyo Night) – désactivé pour l'instant car pas critique
# set -g @tokyo-night-tmux_theme 'moon'
# set -g @tokyo-night-tmux_window_id_style 'none'
# set -g @tokyo-night-tmux_pane_id_style 'none' 
# set -g @tokyo-night-tmux_zoom_id_style 'none'

# ──────────────────────────────────────────────────────────────────────
# 🖱️ Souris & Sélection
set -g mouse on                    # Active la souris (redimension, scroll, sélection)
set -g focus-events on             # Permet de détecter quand le terminal perd/gagne le focus
set -g set-clipboard on            # 🔑 Clé : permet à tmux de gérer le presse-papiers

# Configuration pour la copie sur macOS
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ──────────────────────────────────────────────────────────────────────
# 🧩 Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Configuration tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Configuration tmux-continuum (sauvegarde automatique)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ──────────────────────────────────────────────────────────────────────
# 🛠️ Paramètres de base
set-option -g base-index 1         # Numérotation des fenêtres à partir de 1
set-option -g pane-base-index 1    # Même chose pour les panes
set-option -g status-position top  # Barre de statut en haut
set -g renumber-windows on         # Renumber automatiquement après fermeture

# Désactive le mode vi dans les commandes (optionnel, pour plus de simplicité)
set-option -g status-keys vi

# ──────────────────────────────────────────────────────────────────────
# ⌨️ Raccourcis clavier

# Configuration pour ouvrir les nouveaux panes dans le même répertoire
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Split rapide : Ctrl+l → split horizontal + vertical + focus haut-gauche
bind-key C-l \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -L \; \
  select-pane -U

# Navigation entre fenêtres : Ctrl+Tab / Ctrl+Shift+Tab
bind-key C-Tab next-window
bind-key C-S-Tab previous-window

# Redimensionner avec Alt + flèches
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# ──────────────────────────────────────────────────────────────────────
# === Status bar ===
set-option -g status-position top
set -g status-bg colour235
set -g status-fg colour252
set -g status-left-length 60
set -g status-right-length 180
set -g status-interval 1

# Barre de statut gauche (session et window info)
set -g status-left '#[fg=colour16,bg=colour154,bold] 📟 #S #[fg=colour154,bg=colour238,nobold]#[fg=colour255,bg=colour238,bold] 🪟  #I:#P #[fg=colour238,bg=colour235,nobold]'

# Barre de statut droite (informations système et plugins)
set -g status-right '#[fg=colour238,bg=colour235]#[fg=colour255,bg=colour238] #{?client_prefix,🔴 PREFIX,⚫ NORMAL} #[fg=colour241,bg=colour238]#[fg=colour255,bg=colour241] 💾 #{continuum_status} #[fg=colour245,bg=colour241]#[fg=colour233,bg=colour245,bold] 📅 %d/%m #[fg=colour154,bg=colour245]#[fg=colour16,bg=colour154,bold] ⏰ %H:%M:%S '


# ──────────────────────────────────────────────────────────────────────
# 🧩 Gestion des plugins
run '~/.config/tmux/plugins/tpm/tpm'

# Utilise zsh comme shell par défaut
set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh"

